name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Python 3.9 has no setup-python build for Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail if licensed data or notebooks are tracked
        run: |
          files=$(git ls-files tests/data log notebooks '*.ipynb' '*.geojson' '*.csv' '*.parquet')
          if [ -n "$files" ]; then
            echo "::error::licensed data or notebooks are tracked: $files"
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Check numpy is 1.x
        run: python -c "import numpy; assert numpy.__version__.startswith('1.'), numpy.__version__"

      - name: Test
        run: pytest -rs
