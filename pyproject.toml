[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo_mapper_api"
version = "0.3.0"
description = "A simple API for matching geospatial data to OSM IDs"
authors = [{ name="JP Talusan", email="jptalusan@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["osmnx>=2.1.1,<3",
                "geopandas>=1.0.1",
                "pandas>=2.1",
                "shapely>=2.0",
                "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/scope-lab-vu/geospatial_mapper"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_file = "log/pytest.log"
log_file_level = "DEBUG"
